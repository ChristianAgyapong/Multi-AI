# Render Blueprint — Multimodal AI Tutor (Backend only)
#
# The FastAPI backend is deployed here on Render.
# The Next.js frontend is deployed separately on Vercel.
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. In Render: "New +" -> "Blueprint" -> select this repo.
#   3. After the service is live, copy its public URL (e.g. https://xxx.onrender.com).
#   4. In Vercel, set NEXT_PUBLIC_API_URL=https://xxx.onrender.com for the frontend.
#   5. Come back here and set CORS_ORIGINS=https://your-vercel-app.vercel.app
#
# See DEPLOY.md for the full step-by-step guide.

services:
  - type: web
    name: multimodal-tutor-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Python runtime
      - key: PYTHON_VERSION
        value: 3.11.9

      # Frontend serving disabled (Vercel hosts the UI)
      - key: SERVE_FRONTEND
        value: "0"

      # CORS - fill in your Vercel URL after the frontend is deployed
      - key: CORS_ORIGINS
        sync: false

      # Primary LLM: Groq (OpenAI-compatible, free tier)
      - key: LLM_PROVIDER
        value: openai

      # Groq API key - paste your key (starts with gsk_)
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile

      - key: OPENAI_FALLBACK_MODELS
        value: llama-3.1-8b-instant,llama-3.3-70b-versatile,mixtral-8x7b-32768

      # Vision/document model: OpenRouter (free)
      # OpenRouter API key - paste your key (starts with sk-or-v1-)
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free

      - key: OPENROUTER_FALLBACK_MODELS
        value: openrouter/free,meta-llama/llama-3.3-70b-instruct:free

      # Optional extras (leave blank if not using)
      - key: GEMINI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ELEVENLABS_API_KEY
        sync: false
