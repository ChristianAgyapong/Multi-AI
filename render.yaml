# Render Blueprint — Multimodal AI Tutor
#
# Deploy the FastAPI backend as a Render Web Service.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. In Render, click "New +" → "Blueprint" → select this repo.
#   3. Render auto-detects render.yaml and creates the service.
#   4. Set your LLM provider env vars (LLM_PROVIDER, GEMINI_API_KEY, etc.)
#      in the service dashboard (or via the "envVars" below).
#
# Note: On Render free tier the filesystem is EPHEMERAL — the SQLite cache
# (data/cache.db) and student profile JSON reset on every redeploy. This is
# acceptable for a stopgap MVP; for persistence, add a managed Postgres/Redis.

services:
  - type: web
    name: multimodal-tutor-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── LLM provider ─────────────────────────────────────────────────────
      # For free production hosting, set LLM_PROVIDER=gemini and a free key.
      - key: LLM_PROVIDER
        value: gemini
        sync: false            # set your own value in the dashboard
      - key: GEMINI_API_KEY
        sync: false
      # ── OpenAI-compatible (optional) ────────────────────────────────────
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: OPENAI_BASE_URL
      #   value: https://openrouter.ai/api/v1
      # - key: OPENAI_MODEL
      #   value: deepseek/deepseek-r1-distill-qwen-32b:free
      # ── Vision (optional) ───────────────────────────────────────────────
      # - key: VISION_API_KEY
      #   sync: false
      # - key: VISION_BASE_URL
      #   value: https://openrouter.ai/api/v1
      # ── API behaviour ───────────────────────────────────────────────────
      # Allow the deployed Next.js frontend (or any origin for now).
      - key: CORS_ORIGINS
        value: "*"
      # Serve the legacy vanilla-JS UI at the API root as a stopgap.
      - key: SERVE_FRONTEND
        value: "1"
