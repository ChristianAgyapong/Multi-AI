# Render Blueprint — Multimodal AI Tutor
#
# Deploy the FastAPI backend as a Render Web Service.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. In Render, click "New +" → "Blueprint" → select this repo.
#   3. Render auto-detects render.yaml and creates the service.
#   4. Set your LLM provider env vars (LLM_PROVIDER, GEMINI_API_KEY, etc.)
#      in the service dashboard (or via the "envVars" below).
#
# Note: On Render free tier the filesystem is EPHEMERAL — the SQLite cache
# (data/cache.db) and student profile JSON reset on every redeploy. This is
# acceptable for a stopgap MVP; for persistence, add a managed Postgres/Redis.

services:
  - type: web
    name: multimodal-tutor-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENAI_VISION_MODEL
        value: google/gemma-4-26b-a4b-it:free

  - type: web
    name: multimodal-tutor-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: multimodal-tutor-api
          envVarKey: RENDER_EXTERNAL_URL
